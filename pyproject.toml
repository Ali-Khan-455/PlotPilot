[project]
name = "plotpilot"
version = "0.1.0"
description = "Convert novels into TTS-ready first-person YouTube narration scripts."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned so the result doesn't depend on the installed ruff version's defaults (0.16 widened them).
select = ["E4", "E7", "E9", "F"]
